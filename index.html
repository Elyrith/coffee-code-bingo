<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells the browser both themes are supported before it paints, so the
       background, scrollbars and default controls match (no white flash). -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3b2a20" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1510" media="(prefers-color-scheme: dark)">
  <title>Coffee &amp; Code Bingo</title>
  <meta name="description" content="Bingo for Coffee &amp; Code at the Brampton Library. Tap a square when you hear it.">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <h1>Coffee &amp; Code Bingo</h1>
  </header>

  <main>
    <div id="status" class="status" role="status">&nbsp;</div>
    <div id="card" class="card" role="group" aria-label="Bingo card"></div>

    <div class="actions">
      <button id="new-card" type="button">New card</button>
      <button id="clear" type="button">Clear marks</button>
      <span class="copy">
        <button id="share" type="button">Copy card link</button>
        <!-- The bubble is the live region. It stays empty until a copy and sits
             outside the button, whose children are not reliably announced. -->
        <span id="copy-tip" class="copy-tip" role="status"></span>
      </span>
    </div>
    <p class="fine">Your card and marks are saved on this device. “Copy card link” lets you use the same card elsewhere.</p>

    <section class="share">
      <h2>Scan to get your own card</h2>
      <div class="qr">
        <img src="assets/qr-code.svg" width="240" height="240"
             alt="QR code for https://elyrith.github.io/coffee-code-bingo/">
      </div>
    </section>
  </main>

  <!-- Confirmation for "New card" and "Clear marks"; filled in and opened by
       app.js. Esc, the back gesture and a tap outside all count as Cancel. -->
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text" closedby="any">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" autofocus>Cancel</button>
        <button value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <noscript><p class="fine">This page needs JavaScript to build your card.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
